name: Gymnathlon Checker

on:
  schedule:
    - cron: '*/15 * * * *'

  workflow_dispatch:

jobs:
  check-gymnathlon:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create Gmail credentials
        run: |
          echo '${{ secrets.GMAIL_CREDENTIALS }}' > credentials.json
          echo '${{ secrets.GMAIL_TOKEN }}' > token.json

      - name: Run Gymnathlon checker
        run: node monitor.js

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f state.json ]; then
            git add -f state.json

            if git diff --cached --quiet; then
              echo "State sa nezmenil."
            else
              git commit -m "Update checker state"
              git push
            fi
          else
            echo "state.json neexistuje - nie je co ulozit."
          fi