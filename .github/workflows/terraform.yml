name: Terraform CI

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

  schedule:
    - cron: "30 7 * * 1-5"
      timezone: "Europe/Bratislava"

  workflow_dispatch:

defaults:
  run:
    working-directory: ./terraform

permissions:
  contents: read
  id-token: write

jobs:
  terraform-plan:
    runs-on: ubuntu-24.04
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::103415318899:role/terraform-ci
          role-session-name: terraform-ci
          aws-region: eu-central-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan -detailed-exitcode
          TERRAFORM_EXIT_CODE=$?
          
          echo "exitcode=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          echo "Terraform CLI exit code: $TERRAFORM_EXIT_CODE"
          exit 0

      - name: Check Terraform Plan Result
        run: |
          EXIT_CODE="${{ steps.plan.outputs.exitcode }}"

          case "$EXIT_CODE" in
            0)
              echo "Terraform plan: no changes."
              ;;

            1)
              echo "::error::Terraform plan failed."
              exit 1
              ;;

            2)
              if [ "${{ github.event_name }}" = "push" ]; then
                echo "::warning::Terraform plan detected infrastructure changes after push."
              else
                echo "::error::Terraform detected unexpected infrastructure changes."
                exit 1
              fi
              ;;

            *)
              echo "::error::Unexpected Terraform exit code: $EXIT_CODE"
              exit 1
              ;;
          esac