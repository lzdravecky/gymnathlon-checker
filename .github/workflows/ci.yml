name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::103415318899:role/gymnathlon-github-deploy-role
          aws-region: eu-central-1 
          
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Create Lambda package
        run: zip -r gymnathlon-lambda.zip monitor.js package.json package-lock.json node_modules 
        
      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name gymnathlon-checker \
            --zip-file fileb://gymnathlon-lambda.zip  
